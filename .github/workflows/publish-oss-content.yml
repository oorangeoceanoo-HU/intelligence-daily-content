name: Publish Mobile Content To OSS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "latest.json"
      - "issues/**"
      - "editions/**"
      - "personalization/latest.json"
      - "aliyun/content-publishing/**"
      - ".github/workflows/publish-oss-content.yml"
  workflow_run:
    workflows:
      - Prepare Daily Review
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: publish-mobile-content-to-oss
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out published content
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check OSS publishing configuration
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ vars.ALIYUN_OSS_ENDPOINT || 'oss-cn-hangzhou.aliyuncs.com' }}
          OSS_DESTINATION: ${{ vars.ALIYUN_OSS_DESTINATION || 'oss://shixiaobao-content-cn-20260824/public' }}
          OSS_PUBLIC_BASE_URL: ${{ vars.ALIYUN_OSS_PUBLIC_BASE_URL || 'https://shixiaobao-content-cn-20260824.oss-cn-hangzhou.aliyuncs.com/public' }}
        run: |
          for name in OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: ALIYUN_OSS_${name#OSS_}" >&2
              exit 1
            fi
          done
          echo "OSS destination: $OSS_DESTINATION"
          echo "OSS public base URL: $OSS_PUBLIC_BASE_URL"

      - name: Prevent an older repository issue from replacing the mobile issue
        id: freshness
        env:
          OSS_PUBLIC_BASE_URL: ${{ vars.ALIYUN_OSS_PUBLIC_BASE_URL || 'https://shixiaobao-content-cn-20260824.oss-cn-hangzhou.aliyuncs.com/public' }}
        run: |
          HTTP_STATUS="$(curl --silent --show-error --location \
            "$OSS_PUBLIC_BASE_URL/latest.json?checked_at=$(date +%s)" \
            --output /tmp/oss-current-latest.json \
            --write-out '%{http_code}' || true)"
          if [ "$HTTP_STATUS" = "404" ]; then
            echo "OSS latest.json does not exist yet; allowing the first upload."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$HTTP_STATUS" =~ ^2 ]]; then
            echo "Unable to read the current OSS latest.json (HTTP $HTTP_STATUS); refusing to overwrite it." >&2
            exit 1
          fi
          if [ -s /tmp/oss-current-latest.json ]; then
            echo "Existing OSS latest.json found."
          else
            echo "OSS latest.json returned an empty response; refusing to overwrite it." >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const local = JSON.parse(fs.readFileSync('latest.json', 'utf8')).issue;
          const remote = JSON.parse(fs.readFileSync('/tmp/oss-current-latest.json', 'utf8')).issue;
          const editionRank = { morning: 1, midday: 2, evening: 3 };
          const localRank = editionRank[local.edition] ?? 0;
          const remoteRank = editionRank[remote.edition] ?? 0;
          const isNewEnough = local.date > remote.date || (local.date === remote.date && localRank >= remoteRank);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_publish=${isNewEnough}\n`);
          console.log(`Repository issue: ${local.date} ${local.edition}; OSS issue: ${remote.date} ${remote.edition}.`);
          console.log(isNewEnough ? 'Publishing the repository issue.' : 'Skipping older repository issue.');
          NODE

      - name: Install ossutil
        if: steps.freshness.outputs.should_publish == 'true'
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/ossutil.zip \
            https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          unzip -q /tmp/ossutil.zip -d /tmp/ossutil-bin
          OSSUTIL_BINARY="$(find /tmp/ossutil-bin -type f \( -name ossutil64 -o -name ossutil \) | head -n 1)"
          test -n "$OSSUTIL_BINARY"
          chmod +x "$OSSUTIL_BINARY"
          ln -s "$OSSUTIL_BINARY" /tmp/ossutil
          /tmp/ossutil version

      - name: Configure least-privilege OSS uploader
        if: steps.freshness.outputs.should_publish == 'true'
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ vars.ALIYUN_OSS_ENDPOINT || 'oss-cn-hangzhou.aliyuncs.com' }}
        run: |
          /tmp/ossutil config \
            -e "$OSS_ENDPOINT" \
            -i "$OSS_ACCESS_KEY_ID" \
            -k "$OSS_ACCESS_KEY_SECRET"

      - name: Publish approved daily content
        if: steps.freshness.outputs.should_publish == 'true'
        env:
          OSS_DESTINATION: ${{ vars.ALIYUN_OSS_DESTINATION || 'oss://shixiaobao-content-cn-20260824/public' }}
          OSSUTIL_BIN: /tmp/ossutil
        run: ./aliyun/content-publishing/publish-oss.sh

      - name: Verify mobile files are publicly readable
        env:
          OSS_PUBLIC_BASE_URL: ${{ vars.ALIYUN_OSS_PUBLIC_BASE_URL || 'https://shixiaobao-content-cn-20260824.oss-cn-hangzhou.aliyuncs.com/public' }}
        run: |
          for path in latest.json manifest.json personalization/latest.json; do
            output="/tmp/${path//\//-}"
            curl --fail --silent --show-error --location \
              "$OSS_PUBLIC_BASE_URL/$path?published_at=$(date +%s)" \
              --output "$output"
            test -s "$output"
          done
          cp /tmp/personalization-latest.json /tmp/oss-personalization-latest.json
          node -e "const fs=require('node:fs'); const issue=JSON.parse(fs.readFileSync('/tmp/latest.json')).issue; if (!issue?.date || !Array.isArray(issue.cards)) process.exit(1); console.log('OSS latest issue:', issue.date, issue.cards.length, 'cards');"
          node <<'NODE'
          const fs = require('node:fs');
          const rank = { morning: 1, midday: 2, evening: 3 };
          const local = JSON.parse(fs.readFileSync('latest.json')).issue;
          const remote = JSON.parse(fs.readFileSync('/tmp/latest.json')).issue;
          const localIsNewEnough = local.date > remote.date || (local.date === remote.date && (rank[local.edition] ?? 0) >= (rank[remote.edition] ?? 0));
          if (!localIsNewEnough) {
            throw new Error(`OSS latest is older than repository latest: ${remote.date} ${remote.edition} vs ${local.date} ${local.edition}`);
          }
          const localPersonalization = JSON.parse(fs.readFileSync('personalization/latest.json')).issue;
          const remotePersonalization = JSON.parse(fs.readFileSync('/tmp/oss-personalization-latest.json')).issue;
          if (localPersonalization.date !== remotePersonalization.date || localPersonalization.edition !== remotePersonalization.edition) {
            throw new Error(`OSS personalization is stale: ${remotePersonalization.date} ${remotePersonalization.edition} vs ${localPersonalization.date} ${localPersonalization.edition}`);
          }
          console.log('OSS content matches the repository date and edition.');
          NODE
