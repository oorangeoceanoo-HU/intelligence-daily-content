name: Prepare Daily Review

on:
  workflow_dispatch:
    inputs:
      date:
        description: Optional issue date in YYYY-MM-DD; blank uses Asia/Shanghai today
        required: false
        type: string
      edition:
        description: Publication window
        required: false
        default: auto
        type: choice
        options:
          - auto
          - morning
          - midday
          - evening
      as_of:
        description: Optional ISO timestamp used when replaying a historical edition
        required: false
        type: string
  schedule:
    # GitHub Actions cron uses UTC. These runs are scheduled before the
    # China-time reading reminders at 08:30, 12:30, and 21:30.
    - cron: "0 0 * * *"
    - cron: "0 4 * * *"
    - cron: "0 13 * * *"
    # A short retry absorbs normal scheduler delays without changing the
    # edition selection logic.
    - cron: "20 0 * * *"
    - cron: "20 4 * * *"
    - cron: "20 13 * * *"

permissions:
  contents: write

concurrency:
  group: prepare-daily-review
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out content repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: .cache/content-translations.json
          key: translation-cache-${{ github.run_id }}
          restore-keys: |
            translation-cache-

      - name: Resolve issue date
        id: issue-date
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          TZ: Asia/Shanghai
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            DATE="$REQUESTED_DATE"
          else
            # GitHub-hosted runners use UTC by default. Resolve the issue date
            # in the product timezone explicitly so a near-midnight run cannot
            # be written into the previous day's archive.
            DATE="$(node <<'NODE'
          const parts = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Shanghai',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
          }).formatToParts(new Date());
          const value = (type) => parts.find((part) => part.type === type)?.value ?? '';
          process.stdout.write(`${value('year')}-${value('month')}-${value('day')}`);
          NODE
            )"
          fi
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date: $DATE" >&2
            exit 1
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Resolve edition
        id: issue-edition
        env:
          REQUESTED_EDITION: ${{ inputs.edition }}
          TZ: Asia/Shanghai
        run: |
          if [ "$REQUESTED_EDITION" = "morning" ] || [ "$REQUESTED_EDITION" = "midday" ] || [ "$REQUESTED_EDITION" = "evening" ]; then
            EDITION="$REQUESTED_EDITION"
          else
            HOUR="$(node <<'NODE'
          const parts = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Asia/Shanghai',
            hour: '2-digit',
            hour12: false
          }).formatToParts(new Date());
          process.stdout.write(parts.find((part) => part.type === 'hour')?.value ?? '00');
          NODE
            )"
            if [ "$HOUR" -lt 10 ]; then EDITION="morning"; elif [ "$HOUR" -lt 17 ]; then EDITION="midday"; else EDITION="evening"; fi
          fi
          echo "edition=$EDITION" >> "$GITHUB_OUTPUT"

      - name: Generate pending issue
        env:
          DATE: ${{ steps.issue-date.outputs.date }}
          EDITION: ${{ steps.issue-edition.outputs.edition }}
          AS_OF: ${{ inputs.as_of }}
          CONTENT_TRANSLATION_PROVIDER: ${{ vars.CONTENT_TRANSLATION_PROVIDER || 'google-free' }}
          CONTENT_TRANSLATION_ENDPOINT: ${{ secrets.CONTENT_TRANSLATION_ENDPOINT }}
          CONTENT_TRANSLATION_API_KEY: ${{ secrets.CONTENT_TRANSLATION_API_KEY }}
          CONTENT_TRANSLATION_MODEL: ${{ vars.CONTENT_TRANSLATION_MODEL }}
          CONTENT_TRANSLATION_CONTACT_EMAIL: ${{ vars.CONTENT_TRANSLATION_CONTACT_EMAIL }}
          CONTENT_TRANSLATION_CACHE_FILE: .cache/content-translations.json
          CONTENT_CITY_OFFICIAL_URLS_JSON: ${{ vars.CONTENT_CITY_OFFICIAL_URLS_JSON }}
          CONTENT_CITY_NEWS_RSS_TEMPLATE: ${{ secrets.CONTENT_CITY_NEWS_RSS_TEMPLATE }}
          CONTENT_RELIEFWEB_APPNAME: ${{ secrets.CONTENT_RELIEFWEB_APPNAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p tmp
          AS_OF_ARGS=()
          if [ -n "$AS_OF" ]; then AS_OF_ARGS+=(--as-of "$AS_OF"); fi
          node generator/scripts/generateDailyIssue.js \
            --publish \
            --profile public \
            --all \
            --source-limit 18 \
            --cards 24 \
            --edition "$EDITION" \
            --date "$DATE" \
            "${AS_OF_ARGS[@]}" \
            --output "tmp/review-$DATE-$EDITION.json"
          node generator/scripts/createDailyReviewSummary.js \
            --date "$DATE" \
            --review-input "tmp/review-$DATE-$EDITION.json" \
            --candidate-input "outputs/publish/editions/$DATE/$EDITION.json" \
            --pending-output "pending/$DATE-$EDITION.json" \
            --summary-output "pending/$DATE-$EDITION.md" \
            --report-output "pending/$DATE-$EDITION.review.json"

      - name: Show review summary
        env:
          DATE: ${{ steps.issue-date.outputs.date }}
          EDITION: ${{ steps.issue-edition.outputs.edition }}
        run: cat "pending/$DATE-$EDITION.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve source health snapshot
        env:
          DATE: ${{ steps.issue-date.outputs.date }}
          EDITION: ${{ steps.issue-edition.outputs.edition }}
        run: |
          mkdir -p audit/source-health
          cp \
            "outputs/publish/audit/source-health/$DATE-$EDITION.json" \
            "audit/source-health/$DATE-$EDITION.json"

      - name: Read quality gate
        id: quality-gate
        env:
          DATE: ${{ steps.issue-date.outputs.date }}
          EDITION: ${{ steps.issue-edition.outputs.edition }}
        run: |
          STATUS="$(node -e "const r=require('./pending/$DATE-$EDITION.review.json'); process.stdout.write(r.status)")"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "blocked" ]; then
            echo "Quality gate blocked publication. The previous latest.json stays online." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Quality gate has no blocker. This edition will be published automatically." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish issue after quality gate
        if: steps.quality-gate.outputs.status != 'blocked'
        env:
          DATE: ${{ steps.issue-date.outputs.date }}
          EDITION: ${{ steps.issue-edition.outputs.edition }}
        run: |
          node generator/scripts/approveDailyIssue.js \
            --date "$DATE" \
            --edition "$EDITION" \
            --confirmation APPROVE

      - name: Preserve latest personalization pool
        if: steps.quality-gate.outputs.status != 'blocked'
        env:
          DATE: ${{ steps.issue-date.outputs.date }}
          EDITION: ${{ steps.issue-edition.outputs.edition }}
        run: |
          mkdir -p personalization
          node - <<'NODE'
          const fs = require('node:fs');
          const currentPath = `tmp/review-${process.env.DATE}-${process.env.EDITION}.json`;
          const outputPath = 'personalization/latest.json';
          const current = JSON.parse(fs.readFileSync(currentPath, 'utf8'));
          let previous;
          try { previous = JSON.parse(fs.readFileSync(outputPath, 'utf8')); } catch {}
          const previousPool = previous?.issue?.date === current.issue.date
            ? previous.personalizationPool ?? []
            : [];
          const poolById = new Map();
          [...previousPool, ...(current.personalizationPool ?? [])].forEach((item) => {
            const id = item?.candidate?.id ?? item?.card?.id;
            if (id) poolById.set(id, item);
          });
          current.personalizationPool = [...poolById.values()];
          fs.writeFileSync(outputPath, `${JSON.stringify(current, null, 2)}\n`);
          console.log(`Preserved ${current.personalizationPool.length} candidates for ${current.issue.date}.`);
          NODE

      - name: Save private diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-review-${{ steps.issue-date.outputs.date }}-${{ steps.issue-edition.outputs.edition }}
          path: tmp/review-${{ steps.issue-date.outputs.date }}-${{ steps.issue-edition.outputs.edition }}.json
          retention-days: 7

      - name: Commit review, health, and published issue
        env:
          DATE: ${{ steps.issue-date.outputs.date }}
          EDITION: ${{ steps.issue-edition.outputs.edition }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "pending/$DATE-$EDITION.json" \
            "pending/$DATE-$EDITION.md" \
            "pending/$DATE-$EDITION.review.json" \
            "audit/source-health/$DATE-$EDITION.json"
          if [ -f latest.json ] && [ -f "issues/$DATE.json" ] && [ -f "editions/$DATE/$EDITION.json" ]; then
            git add latest.json "issues/$DATE.json" "editions/$DATE/$EDITION.json" personalization/latest.json
          fi
          if git diff --cached --quiet; then
            echo "Review and published content already match the generated result."
            exit 0
          fi
          git commit -m "Process $EDITION daily edition $DATE"
          git push origin HEAD:main

      - name: Publish personalized tester issues
        if: steps.quality-gate.outputs.status != 'blocked'
        env:
          DATE: ${{ steps.issue-date.outputs.date }}
          EDITION: ${{ steps.issue-edition.outputs.edition }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node generator/scripts/publishPersonalizedIssues.js \
            --input "tmp/review-$DATE-$EDITION.json" \
            --output "tmp/personalized-$DATE-$EDITION.json" \
            --skip-when-unconfigured

      - name: Save personalized generation report
        if: steps.quality-gate.outputs.status != 'blocked'
        uses: actions/upload-artifact@v4
        with:
          name: personalized-issues-${{ steps.issue-date.outputs.date }}-${{ steps.issue-edition.outputs.edition }}
          path: tmp/personalized-${{ steps.issue-date.outputs.date }}-${{ steps.issue-edition.outputs.edition }}.json
          if-no-files-found: ignore
          retention-days: 14
