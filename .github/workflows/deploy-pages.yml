name: Deploy Daily Content Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out content
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p site/issues
          cp latest.json site/latest.json
          cp issues/*.json site/issues/
          node generator/scripts/createIssueManifest.js \
            --issues-directory issues \
            --output site/manifest.json
          touch site/.nojekyll
          printf '<!doctype html><meta charset="utf-8"><title>Intelligence Daily Content</title>' > site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
