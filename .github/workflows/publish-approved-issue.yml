name: Publish Approved Issue

on:
  workflow_dispatch:
    inputs:
      date:
        description: Issue date in YYYY-MM-DD
        required: true
        type: string
      confirmation:
        description: Type APPROVE after reading the pending summary and cards
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out content repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Approve pending issue
        env:
          DATE: ${{ inputs.date }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          node generator/scripts/approveDailyIssue.js \
            --date "$DATE" \
            --confirmation "$CONFIRMATION" \
            --pending-directory pending \
            --output-directory .

      - name: Commit approved issue
        env:
          DATE: ${{ inputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json "issues/$DATE.json"
          if ! git diff --cached --quiet; then
            git commit -m "Publish approved daily issue $DATE"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public files
        run: |
          mkdir -p site/issues
          cp latest.json site/latest.json
          cp issues/*.json site/issues/
          touch site/.nojekyll
          printf '<!doctype html><meta charset="utf-8"><title>Intelligence Daily Content</title>' > site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
